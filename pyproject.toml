[project]
name = "account-automation-lab"
version = "0.1.0"
description = "Internal account registration automation control plane with guarded Playwright workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler==3.11.2",
    "cloakbrowser==0.3.30",
    "fastapi==0.136.3",
    "httpx>=0.28.1",
    "nicegui==3.12.1",
    "playwright==1.60.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-dotenv>=1.2.1",
    "supabase==2.30.0",
    "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.6",
]

[project.scripts]
account-automation-lab = "account_automation_lab.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/account_automation_lab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src", "tests"]
